name: CML Workflow for Temperature Prediction # Nombre del flujo

on: [push] # Activación automática con cada 'git push'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Versión actualizada
      
    - name: Set up Python
      uses: actions/setup-python@v5 # Versión actualizada
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. Ejecuta el script de entrenamiento, que genera 'report.md' y 'predictions_plot.png'
    - name: Run training and generate report
      run: python train.py
      
# ------------------------------------------------------------------
#  PASOS PARA REPORTAR MÉTRICAS Y PARÁMETROS (CML) 
# ------------------------------------------------------------------

    - name: Setup CML
      uses: iterative/setup-cml@v4 # Versión actualizada para evitar advertencias

    - name: Publish Report and Metrics
      env:
        # Token necesario para que CML pueda comentar en el Pull Request o Commit
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # Añade el gráfico al reporte. CML lo sube y genera el enlace.
        cml-publish predictions_plot.png --title "Gráfico de Predicciones" >> report.md

        # Publica el contenido completo de report.md (parámetros, métricas, gráfico) 
        # como un comentario en el Commit que disparó la acción.
        cml-send-comment report.md
        
# ------------------------------------------------------------------
#  FIN DE PASOS DE REPORTE
# ------------------------------------------------------------------

    # Sube el gráfico como un artefacto de GitHub (opcional pero útil)
    - name: Upload Plot as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: predictions-plot 
        path: predictions_plot.png