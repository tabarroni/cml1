name: CML Workflow for Temperature Prediction

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 

    - name: Set up Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run training and generate report
      run: python train.py
      
# ------------------------------------------------------------------
#  PASOS DE REPORTE CML (VERSION CORREGIDA)
# ------------------------------------------------------------------

    - name: Setup CML
      uses: iterative/setup-cml@v2 # CAMBIAR A V2 O V1

    - name: Publish Report and Metrics
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # 1. Publica el gráfico (asume que 'train.py' lo crea)
        cml-publish predictions_plot.png --title "Gráfico de Predicciones" >> report.md

        # 2. Publica el comentario (asume que 'train.py' crea 'report.md')
        cml-send-comment report.md
        
# ------------------------------------------------------------------

    - name: Upload Plot as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: predictions-plot 
        path: predictions_plot.png